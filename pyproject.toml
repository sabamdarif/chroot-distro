[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chroot-distro"
version = "3.0.0"
description = "chroot-distro is a lightweight Linux container management utility built around chroot."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = ["backports-zstd; python_version < '3.14'"]

[project.scripts]
chroot-distro = "chroot_distro.cli:main"

[project.urls]
Homepage = "https://github.com/sabamdarif/chroot-distro"
Repository = "https://github.com/sabamdarif/chroot-distro"
"Bug Tracker" = "https://github.com/sabamdarif/chroot-distro/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chroot_distro" = ["py.typed"]

[tool.setuptools.exclude-package-data]
"chroot_distro.completions" = ["*"]

[tool.setuptools.data-files]
"share/bash-completion/completions" = [
	"src/chroot_distro/completions/chroot-distro.bash",
]
"share/zsh/site-functions" = ["src/chroot_distro/completions/_chroot-distro"]
"share/fish/vendor_completions.d" = [
	"src/chroot_distro/completions/chroot-distro.fish",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"W",
	"I",
	"N",
	"UP",
	"ASYNC",
	"B",
	"A",
	"C4",
	"DTZ",
	"PIE",
	"PT",
	"RET",
	"SIM",
	"PLC",
	"PLE",
	"PLW",
	"RUF",
]
ignore = ["E501", "PT012", "PLC0415"]


[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.mypy]
platform = "linux"
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["chroot_distro.cli", "chroot_distro.paths", "chroot_distro.constants"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[dependency-groups]
dev = [
	"pytest>=8.0",
	"pytest-cov>=5.0",
	"ruff>=0.6",
	"mypy>=1.10",
	"pyright>=1.1",
	"backports-zstd",
	"pre-commit>=3.0",
	"build>=1.5.0",
	"twine>=6.2.0",
]
