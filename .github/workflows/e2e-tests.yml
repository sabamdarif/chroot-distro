name: Integration Tests (E2E)

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["**"]

jobs:
    e2e:
        name: E2E Tests (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.12", "3.14"]

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install chroot-distro
              run: |
                  # The suites run chroot-distro under sudo (root's install)
                  # and import the library as the runner user (this install).
                  # The user's pip runs first: the sudo one leaves a root-owned
                  # egg-info in the tree that the user's build could not update.
                  pip install .
                  sudo pip install . --break-system-packages
                  chroot-distro --version

            # One script per test under tests/e2e/<phase>/, run in order by
            # run-all.sh. The suites share runner state, so they stay in one job
            # on one runner; cleanup.sh is separate because it must also run
            # after a failure.
            - name: Run E2E suites
              run: bash tests/e2e/run-all.sh

            - name: cleanup.sh
              if: always()
              run: bash tests/e2e/cleanup.sh
