name: Integration Tests (E2E)

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    e2e:
        name: E2E Tests (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

        steps:
            # ── Setup ──────────────────────────────────────────────────────
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install chroot-distro
              run: |
                  sudo pip install . --break-system-packages
                  chroot-distro --version

            # ── Phase 0: Smoke Tests ───────────────────────────────────────
            - name: "Smoke: --version"
              run: chroot-distro --version

            - name: "Smoke: --help"
              run: chroot-distro --help

            - name: "Smoke: list (empty)"
              run: sudo chroot-distro list

            - name: "Smoke: ps"
              run: sudo chroot-distro ps

            - name: "Smoke: search alpine"
              run: chroot-distro search alpine

            - name: "Smoke: info"
              run: sudo chroot-distro info

            - name: "Smoke: clear-cache"
              run: sudo chroot-distro clear-cache

            # ── Phase 1: Install Containers ────────────────────────────────
            - name: "Install: Alpine"
              run: sudo chroot-distro install alpine:latest

            - name: "Install: Debian"
              run: sudo chroot-distro install debian:bookworm-slim

            - name: "Verify: list shows both containers"
              run: |
                  output=$(sudo chroot-distro list 2>&1)
                  echo "$output"
                  echo "$output" | grep -q "alpine"
                  echo "$output" | grep -q "debian"

            - name: "Verify: list verbose"
              run: sudo chroot-distro list -v

            # ── Phase 2: Login & Command Execution ─────────────────────────
            - name: "Login: Alpine - verify os-release"
              run: |
                  output=$(sudo chroot-distro login alpine -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "alpine"

            - name: "Login: Debian - verify os-release"
              run: |
                  output=$(sudo chroot-distro login debian -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "debian"

            - name: "Login: Debian --user root"
              run: |
                  output=$(sudo chroot-distro login debian --user root -- whoami)
                  echo "$output"
                  echo "$output" | grep -q "root"

            - name: "Login: Debian --work-dir /tmp"
              run: |
                  output=$(sudo chroot-distro login debian --work-dir /tmp -- pwd)
                  echo "$output"
                  echo "$output" | grep -q "/tmp"

            - name: "Login: Debian --env injection"
              run: |
                  output=$(sudo chroot-distro login debian --env TEST_VAR=hello123 -- printenv TEST_VAR)
                  echo "$output"
                  echo "$output" | grep -q "hello123"

            - name: "Login: exit code of inner command propagates"
              run: |
                  sudo chroot-distro login alpine -- true
                  echo "PASS: exit 0 propagates"
                  if sudo chroot-distro login alpine -- false; then
                    echo "FAIL: 'login -- false' exited 0"; exit 1
                  fi
                  sudo chroot-distro login alpine -- sh -c 'exit 42' && rc=0 || rc=$?
                  [ "$rc" -eq 42 ] || { echo "FAIL: expected exit 42, got $rc"; exit 1; }
                  echo "PASS: non-zero exit codes propagate"

            # ── Phase 3: Isolation / Escape Prevention ─────────────────────
            - name: "Isolation: Debian --isolated login"
              run: |
                  output=$(sudo chroot-distro login debian --isolated -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "debian"
                  # Must NOT contain the host OS (Ubuntu on GitHub runners)
                  if echo "$output" | grep -qi "ID=ubuntu"; then
                    echo "FAIL: Host OS leaked into isolated container!"
                    exit 1
                  fi
                  echo "PASS: Isolated container shows correct OS"

            - name: "Isolation: Debian escape attempt via /proc/1/root"
              run: |
                  output=$(sudo chroot-distro login debian --isolated -- \
                    sh -c 'cat /proc/1/root/etc/os-release 2>/dev/null || echo ESCAPE_BLOCKED')
                  echo "$output"
                  if echo "$output" | grep -qi "ID=ubuntu"; then
                    echo "FAIL: Chroot escape detected! Host OS visible from inside container."
                    exit 1
                  fi
                  echo "PASS: Escape blocked or contained"

            - name: "Unmount: Debian after isolation test"
              run: sudo chroot-distro unmount debian || true

            - name: "Isolation: Alpine --isolated login"
              run: |
                  output=$(sudo chroot-distro login alpine --isolated -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "alpine"
                  if echo "$output" | grep -qi "ID=ubuntu"; then
                    echo "FAIL: Host OS leaked into isolated container!"
                    exit 1
                  fi
                  echo "PASS: Isolated container shows correct OS"

            - name: "Isolation: Alpine escape attempt via /proc/1/root"
              run: |
                  output=$(sudo chroot-distro login alpine --isolated -- \
                    sh -c 'cat /proc/1/root/etc/os-release 2>/dev/null || echo ESCAPE_BLOCKED')
                  echo "$output"
                  if echo "$output" | grep -qi "ID=ubuntu"; then
                    echo "FAIL: Chroot escape detected!"
                    exit 1
                  fi
                  echo "PASS: Escape blocked or contained"

            - name: "Unmount: Alpine after isolation test"
              run: sudo chroot-distro unmount alpine || true

            # ── Phase 4: httpd Service Test (foreground) ───────────────────
            - name: "Install: httpd"
              run: sudo chroot-distro install httpd:latest

            - name: "Run: httpd foreground (backgrounded) and verify"
              run: |
                  sudo chroot-distro run httpd &
                  HTTPD_PID=$!
                  echo "httpd launched (shell PID: $HTTPD_PID), waiting for it to start..."

                  # Poll until httpd responds or timeout after 60 seconds
                  success=false
                  for i in $(seq 1 30); do
                    if curl -s http://localhost/ 2>/dev/null | grep -q "It works!"; then
                      echo "httpd is serving on attempt $i!"
                      success=true
                      break
                    fi
                    sleep 2
                  done

                  if [ "$success" = false ]; then
                    echo "FAIL: httpd did not start serving within 60 seconds"
                    curl -v http://localhost/ 2>&1 || true
                    exit 1
                  fi

                  # Final assertion on response content
                  response=$(curl -s http://localhost/)
                  echo "--- httpd response ---"
                  echo "$response"
                  echo "--- end response ---"
                  echo "$response" | grep -q "It works!"
                  echo "PASS: httpd serves the default page"

            - name: "Kill: httpd after foreground test"
              run: sudo chroot-distro kill httpd

            - name: "Verify: ps after kill"
              run: sudo chroot-distro ps

            - name: "Unmount: httpd after foreground test"
              run: sudo chroot-distro unmount httpd || true

            # ── Phase 5: Detach Mode Test ──────────────────────────────────
            - name: "Run: httpd --detach"
              run: |
                  sudo chroot-distro run --detach httpd
                  echo "httpd launched in detached mode"

            - name: "Verify: httpd serving in detached mode"
              run: |
                  success=false
                  for i in $(seq 1 30); do
                    if curl -s http://localhost/ 2>/dev/null | grep -q "It works!"; then
                      echo "httpd is serving in detached mode on attempt $i!"
                      success=true
                      break
                    fi
                    sleep 2
                  done

                  if [ "$success" = false ]; then
                    echo "FAIL: httpd did not start serving in detached mode"
                    exit 1
                  fi

                  response=$(curl -s http://localhost/)
                  echo "$response"
                  echo "$response" | grep -q "It works!"
                  echo "PASS: httpd serves in detached mode"

            - name: "Verify: ps shows detached session"
              run: |
                  output=$(sudo chroot-distro ps 2>&1)
                  echo "$output"
                  echo "$output" | grep -qi "httpd"
                  echo "PASS: Detached session visible in ps"

            - name: "Kill: httpd (detached)"
              run: sudo chroot-distro kill httpd

            - name: "Unmount: httpd after detach test"
              run: sudo chroot-distro unmount httpd || true

            # ── Phase 6: Namespace Isolation (CD_USE_NS=1) ─────────────────
            - name: "Namespace: Debian login with CD_USE_NS=1"
              run: |
                  output=$(sudo env CD_USE_NS=1 chroot-distro login debian -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "debian"
                  if echo "$output" | grep -qi "ID=ubuntu"; then
                    echo "FAIL: Host OS leaked under namespace isolation!"
                    exit 1
                  fi
                  echo "PASS: Namespace isolation shows correct OS"

            - name: "Namespace: Alpine login with CD_USE_NS=1"
              run: |
                  output=$(sudo env CD_USE_NS=1 chroot-distro login alpine -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "alpine"
                  if echo "$output" | grep -qi "ID=ubuntu"; then
                    echo "FAIL: Host OS leaked under namespace isolation!"
                    exit 1
                  fi
                  echo "PASS: Namespace isolation shows correct OS for Alpine"

            - name: "Unmount: Debian after namespace test"
              run: sudo chroot-distro unmount debian || true

            - name: "Unmount: Alpine after namespace test"
              run: sudo chroot-distro unmount alpine || true

            # ── Phase 7: Container Management Operations ───────────────────
            - name: "Rename: alpine -> alpine-test"
              run: sudo chroot-distro rename alpine alpine-test

            - name: "Verify: list shows alpine-test, not alpine"
              run: |
                  output=$(sudo chroot-distro list -q 2>&1)
                  echo "$output"
                  echo "$output" | grep -q "alpine-test"

            - name: "Copy: file from container to host"
              run: |
                  sudo chroot-distro copy alpine-test:/etc/hostname ./hostname-test
                  echo "Copied hostname:"
                  cat ./hostname-test

            - name: "Sync: host directory to container"
              run: |
                  mkdir -p /tmp/sync-src
                  echo "sync-test-content" > /tmp/sync-src/testfile.txt
                  sudo chroot-distro sync /tmp/sync-src alpine-test:/tmp/sync-dest
                  output=$(sudo chroot-distro login alpine-test -- cat /tmp/sync-dest/testfile.txt)
                  echo "$output"
                  echo "$output" | grep -q "sync-test-content"
                  echo "PASS: Sync works correctly"

            # ── Phase 7b: --chown on copy and sync ─────────────────────────
            # The flag resolves a name on the side the files land on, so these
            # steps need a real account that exists in the container and not on
            # the host (and one the other way round). uid 1500 with primary
            # group 1600 is deliberately mismatched: a resolver that used the
            # uid as the gid would still pass a 1500:1500 check.
            - name: "Chown: create a guest account with a distinct primary group"
              run: |
                  sudo chroot-distro login alpine-test -- addgroup -g 1600 appgrp
                  sudo chroot-distro login alpine-test -- adduser -D -u 1500 -G appgrp appuser
                  ids=$(sudo chroot-distro login alpine-test -- sh -c 'printf "%s:%s" "$(id -u appuser)" "$(id -g appuser)"')
                  echo "appuser ids: $ids"
                  [ "$ids" = "1500:1600" ] || { echo "FAIL: expected 1500:1600, got $ids"; exit 1; }
                  echo "PASS: guest account ready"

            - name: "Chown: copy resolves the name in the container"
              run: |
                  echo "chown-copy-content" > /tmp/chown-src.txt
                  sudo chroot-distro copy /tmp/chown-src.txt alpine-test:/tmp/chown-copy.txt --chown appuser
                  ids=$(sudo chroot-distro login alpine-test -- stat -c '%u:%g' /tmp/chown-copy.txt)
                  echo "owner: $ids"
                  [ "$ids" = "1500:1600" ] || { echo "FAIL: expected 1500:1600, got $ids"; exit 1; }
                  echo "PASS: --chown appuser landed as 1500:1600 (primary group read from passwd)"

            - name: "Chown: sync gives every entry the named owner"
              run: |
                  rm -rf /tmp/chown-tree
                  mkdir -p /tmp/chown-tree/sub
                  echo alpha > /tmp/chown-tree/a.txt
                  echo beta > /tmp/chown-tree/sub/b.txt
                  ln -sf a.txt /tmp/chown-tree/link
                  sudo chroot-distro sync /tmp/chown-tree alpine-test:/tmp/chown-tree --chown appuser:appgrp

                  # stat without -L, so the symlink reports its own owner rather
                  # than its target's: the flag is applied with lchown.
                  out=$(sudo chroot-distro login alpine-test -- sh -c \
                    "stat -c '%n %u:%g' /tmp/chown-tree /tmp/chown-tree/a.txt \
                       /tmp/chown-tree/sub /tmp/chown-tree/sub/b.txt /tmp/chown-tree/link")
                  echo "$out"
                  [ "$(echo "$out" | wc -l)" -eq 5 ] || { echo "FAIL: stat named fewer entries than were synced"; exit 1; }
                  bad=$(echo "$out" | awk '$2 != "1500:1600"' | wc -l)
                  [ "$bad" -eq 0 ] || { echo "FAIL: $bad entries not owned 1500:1600"; exit 1; }
                  echo "PASS: file, nested file, directory and symlink all owned 1500:1600"

            - name: "Chown: a second sync finds nothing to correct"
              run: |
                  out=$(sudo chroot-distro sync /tmp/chown-tree alpine-test:/tmp/chown-tree \
                    --chown appuser:appgrp -v 2>&1)
                  echo "$out"
                  if echo "$out" | grep -qE "Metadata:|file:|symlink:"; then
                    echo "FAIL: the destination already carries the requested owner, yet it was corrected again"
                    exit 1
                  fi
                  echo "PASS: an already-correct owner is left alone"

            - name: "Chown: ':GROUP' changes the group and keeps the user"
              run: |
                  sudo chroot-distro sync /tmp/chown-tree alpine-test:/tmp/chown-tree --chown :0
                  ids=$(sudo chroot-distro login alpine-test -- stat -c '%u:%g' /tmp/chown-tree/a.txt)
                  echo "owner: $ids"
                  [ "$ids" = "1500:0" ] || { echo "FAIL: expected 1500:0, got $ids"; exit 1; }

                  # The uid arrives as -1 ("leave this one alone"); comparing that
                  # against the destination's own would make every run report the
                  # entry as modified for good.
                  out=$(sudo chroot-distro sync /tmp/chown-tree alpine-test:/tmp/chown-tree --chown :0 -v 2>&1)
                  echo "$out"
                  if echo "$out" | grep -qE "Metadata:|file:|symlink:"; then
                    echo "FAIL: ':GROUP' re-corrected an entry that was already right"
                    exit 1
                  fi
                  echo "PASS: only the group changed, and only once"

            - name: "Chown: numeric ids are taken as they stand"
              run: |
                  sudo chroot-distro copy /tmp/chown-src.txt alpine-test:/tmp/chown-num.txt --chown 4242:4243
                  ids=$(sudo chroot-distro login alpine-test -- stat -c '%u:%g' /tmp/chown-num.txt)
                  echo "owner: $ids"
                  [ "$ids" = "4242:4243" ] || { echo "FAIL: expected 4242:4243, got $ids"; exit 1; }
                  echo "PASS: an id with no passwd entry is still reachable"

            - name: "Chown: a move that was only a rename still reaches every entry"
              run: |
                  sudo chroot-distro login alpine-test -- sh -c \
                    'rm -rf /tmp/mv-src /tmp/mv-dst && mkdir -p /tmp/mv-src/sub && echo data > /tmp/mv-src/sub/f.txt'
                  sudo chroot-distro copy alpine-test:/tmp/mv-src alpine-test:/tmp/mv-dst --move --chown appuser
                  out=$(sudo chroot-distro login alpine-test -- sh -c \
                    "stat -c '%n %u:%g' /tmp/mv-dst /tmp/mv-dst/sub /tmp/mv-dst/sub/f.txt")
                  echo "$out"
                  [ "$(echo "$out" | wc -l)" -eq 3 ] || { echo "FAIL: stat named fewer entries than were moved"; exit 1; }
                  bad=$(echo "$out" | awk '$2 != "1500:1600"' | wc -l)
                  [ "$bad" -eq 0 ] || { echo "FAIL: rename(2) writes nothing, and the walk after it missed $bad entries"; exit 1; }
                  if sudo chroot-distro login alpine-test -- test -e /tmp/mv-src; then
                    echo "FAIL: the source survived the move"; exit 1
                  fi
                  echo "PASS: the moved tree was chowned after the rename"

            - name: "Chown: the host side answers for a host destination"
              run: |
                  sudo useradd -u 4321 -M -s /usr/sbin/nologin hostonly
                  # The container knows no 'hostonly', so a guest-side lookup
                  # would fail here instead of succeeding with the host's id.
                  if sudo chroot-distro login alpine-test -- id hostonly >/dev/null 2>&1; then
                    echo "FAIL: the container knows 'hostonly', so this proves nothing"; exit 1
                  fi
                  sudo chroot-distro copy alpine-test:/etc/hostname /tmp/chown-host.txt --chown hostonly
                  owner=$(stat -c '%u' /tmp/chown-host.txt)
                  echo "host-side owner uid: $owner"
                  [ "$owner" = "4321" ] || { echo "FAIL: expected 4321, got $owner"; exit 1; }
                  echo "PASS: a host destination was resolved against the host passwd"

            - name: "Chown: an unknown name is refused before anything is written"
              run: |
                  if sudo chroot-distro copy /tmp/chown-src.txt alpine-test:/tmp/chown-never.txt --chown ghost; then
                    echo "FAIL: an unknown name was accepted"; exit 1
                  fi
                  if sudo chroot-distro login alpine-test -- test -e /tmp/chown-never.txt; then
                    echo "FAIL: the destination was written despite the error"; exit 1
                  fi
                  echo "PASS: a typo fails the command instead of handing the files to root"

            - name: "Chown: clean up the host account"
              if: always()
              run: |
                  sudo userdel hostonly 2>/dev/null || true
                  # /tmp is sticky, and chown-host.txt now belongs to uid 4321,
                  # so the runner's own account can no longer unlink it.
                  sudo rm -rf /tmp/chown-src.txt /tmp/chown-host.txt /tmp/chown-tree

            - name: "Unmount: alpine-test after sync"
              run: sudo chroot-distro unmount alpine-test || true

            - name: "Backup: alpine-test"
              run: |
                  sudo chroot-distro backup alpine-test -o /tmp/alpine-test-backup.tar.gz
                  ls -lh /tmp/alpine-test-backup.tar.gz
                  echo "PASS: Backup created successfully"

            - name: "Diff: alpine-test"
              run: |
                  sudo chroot-distro diff alpine-test || true
                  echo "PASS: Diff command ran"

            - name: "Remove: alpine-test"
              run: sudo chroot-distro remove alpine-test

            - name: "Verify: alpine-test removed from list"
              run: |
                  output=$(sudo chroot-distro list 2>&1)
                  echo "$output"
                  if echo "$output" | grep -q "alpine-test"; then
                    echo "FAIL: Container not removed!"
                    exit 1
                  fi
                  echo "PASS: Container removed successfully"

            - name: "Restore: from backup"
              run: |
                  sudo chroot-distro restore /tmp/alpine-test-backup.tar.gz
                  output=$(sudo chroot-distro list 2>&1)
                  echo "$output"
                  echo "$output" | grep -q "alpine-test"
                  echo "PASS: Container restored from backup"

            - name: "Verify: restored container works"
              run: |
                  output=$(sudo chroot-distro login alpine-test -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "alpine"
                  echo "PASS: Restored container is functional"

            - name: "Unmount: alpine-test after restore verify"
              run: sudo chroot-distro unmount alpine-test || true

            - name: "Remove: restored alpine-test"
              run: sudo chroot-distro remove alpine-test

            - name: "Reset: debian"
              run: sudo chroot-distro reset debian

            - name: "Verify: debian works after reset"
              run: |
                  output=$(sudo chroot-distro login debian -- cat /etc/os-release)
                  echo "$output"
                  echo "$output" | grep -qi "debian"
                  echo "PASS: Debian container works after reset"

            - name: "Unmount: debian after reset verify"
              run: sudo chroot-distro unmount debian || true

            # ── Phase 8: Build Test ────────────────────────────────────────
            - name: "Build: create test Dockerfile"
              run: |
                  mkdir -p /tmp/test-build-context
                  cat > /tmp/test-build-context/Dockerfile << 'DOCKERFILE'
                  FROM alpine:latest
                  RUN echo "chroot-distro-build-test" > /built.txt
                  DOCKERFILE
                  echo "--- Dockerfile ---"
                  cat /tmp/test-build-context/Dockerfile

            - name: "Build: run chroot-distro build"
              run: |
                  sudo chroot-distro build /tmp/test-build-context \
                    -t test-build:latest \
                    --install-as test-build
                  echo "PASS: Build completed"

            - name: "Verify: built container content"
              run: |
                  output=$(sudo chroot-distro login test-build -- cat /built.txt)
                  echo "$output"
                  echo "$output" | grep -q "chroot-distro-build-test"
                  echo "PASS: Built container has expected content"

            - name: "Unmount: test-build"
              run: sudo chroot-distro unmount test-build || true

            - name: "Remove: test-build"
              run: sudo chroot-distro remove test-build

            # ── Phase 8b: Advanced Build Test ──────────────────────────────
            # A realistic multi-stage build exercising ARG, ENV, WORKDIR,
            # USER, heredoc RUN, COPY --parents, COPY --from,
            # RUN --mount=type=cache/tmpfs/secret, and --build-arg/--secret
            # on the CLI. The result is verified by running commands inside
            # the built container, and a rebuild checks layer caching plus
            # cache-mount persistence across builds.
            - name: "Build (advanced): create multi-stage build context"
              run: |
                  mkdir -p /tmp/adv-build/app/src/lib /tmp/adv-build/config
                  cat > /tmp/adv-build/app/src/main.sh << 'SH'
                  #!/bin/sh
                  . /opt/app/bin/src/lib/util.sh
                  greet
                  SH
                  cat > /tmp/adv-build/app/src/lib/util.sh << 'SH'
                  greet() { echo "hello from util"; }
                  SH
                  echo "loglevel=debug" > /tmp/adv-build/config/app.conf
                  echo "s3cr3t-api-key-do-not-bake" > /tmp/adv-secret.txt
                  cat > /tmp/adv-build/Dockerfile << 'DOCKERFILE'
                  ARG ALPINE_TAG=latest

                  FROM alpine:${ALPINE_TAG} AS builder
                  ARG APP_VERSION=unset
                  ENV BUILD_DIR=/build
                  WORKDIR ${BUILD_DIR}

                  # keep src/ structure relative to the /./ pivot
                  COPY --parents ./app/./src/main.sh ./app/./src/lib/util.sh /build/

                  RUN --mount=type=cache,target=/var/cache/adv \
                      --mount=type=tmpfs,target=/scratch <<'EOF'
                  set -e
                  echo probe > /scratch/probe
                  test -f /scratch/probe
                  if [ -f /var/cache/adv/marker ]; then
                      echo "cache-hit" > /build/cachemount.txt
                  else
                      echo "cache-miss" > /build/cachemount.txt
                      echo populated > /var/cache/adv/marker
                  fi
                  printf 'version=%s\n' "$APP_VERSION" > /build/version.txt
                  chmod +x /build/src/main.sh
                  EOF

                  # secret is available during build but must not be baked in
                  RUN --mount=type=secret,id=apikey \
                      test -s /run/secrets/apikey && \
                      sha256sum /run/secrets/apikey | cut -d' ' -f1 > /build/secret.sha

                  FROM alpine:${ALPINE_TAG}
                  LABEL org.test.suite="chroot-distro-e2e"
                  ENV APP_HOME=/opt/app
                  WORKDIR ${APP_HOME}

                  COPY --from=builder /build/src/ ${APP_HOME}/bin/src/
                  COPY --from=builder /build/version.txt /build/cachemount.txt /build/secret.sha ${APP_HOME}/
                  COPY config/app.conf /etc/app/app.conf

                  RUN adduser -D -u 1234 appuser && chown -R appuser:appuser ${APP_HOME}
                  USER appuser
                  RUN whoami > ${APP_HOME}/built-by.txt
                  CMD ["/opt/app/bin/src/main.sh"]
                  DOCKERFILE
                  echo "--- Dockerfile ---"
                  cat /tmp/adv-build/Dockerfile

            - name: "Build (advanced): run chroot-distro build"
              run: |
                  sudo chroot-distro build /tmp/adv-build \
                    -t test-build-adv:latest \
                    --build-arg APP_VERSION=2.5.1 \
                    --secret id=apikey,src=/tmp/adv-secret.txt \
                    --progress plain \
                    --install-as test-build-adv 2>&1 | tee /tmp/adv-build-1.log
                  echo "PASS: Advanced build completed"

            - name: "Verify (advanced): run built container"
              run: |
                  run() { sudo chroot-distro login test-build-adv -- "$@"; }

                  out=$(run /opt/app/bin/src/main.sh)
                  echo "main.sh output: $out"
                  echo "$out" | grep -q "hello from util"
                  echo "PASS: COPY --parents structure + heredoc chmod + COPY --from work"

                  run cat /opt/app/version.txt | grep -qx "version=2.5.1"
                  echo "PASS: --build-arg reached RUN env"

                  run cat /opt/app/cachemount.txt | grep -qx "cache-miss"
                  echo "PASS: first build saw an empty cache mount"

                  run cat /etc/app/app.conf | grep -qx "loglevel=debug"
                  echo "PASS: plain COPY from context works"

                  run cat /opt/app/built-by.txt | grep -qx "appuser"
                  echo "PASS: USER applied to subsequent RUN"

                  want=$(sha256sum /tmp/adv-secret.txt | cut -d' ' -f1)
                  got=$(run cat /opt/app/secret.sha)
                  [ "$got" = "$want" ]
                  echo "PASS: secret was mounted during build"

                  if run test -e /run/secrets/apikey; then
                    echo "FAIL: secret baked into image"; exit 1
                  fi
                  if run test -e /build; then
                    echo "FAIL: builder stage leaked into final image"; exit 1
                  fi
                  echo "PASS: no secret or builder-stage files in final image"

            - name: "Verify (advanced): rebuild uses cache + cache mount persists"
              run: |
                  sudo chroot-distro unmount test-build-adv || true
                  sudo chroot-distro remove test-build-adv
                  # Different APP_VERSION: early layers stay CACHED, the
                  # cache-mount RUN re-executes and must see the marker
                  # written by the first build.
                  sudo chroot-distro build /tmp/adv-build \
                    -t test-build-adv:latest \
                    --build-arg APP_VERSION=2.5.2 \
                    --secret id=apikey,src=/tmp/adv-secret.txt \
                    --progress plain \
                    --install-as test-build-adv 2>&1 | tee /tmp/adv-build-2.log
                  grep -q "CACHED" /tmp/adv-build-2.log
                  echo "PASS: rebuild reused cached layers"

                  sudo chroot-distro login test-build-adv -- cat /opt/app/version.txt | grep -qx "version=2.5.2"
                  echo "PASS: changed --build-arg invalidated dependent layer"

                  sudo chroot-distro login test-build-adv -- cat /opt/app/cachemount.txt | grep -qx "cache-hit"
                  echo "PASS: RUN --mount=type=cache persisted across builds"

            - name: "Unmount: test-build-adv"
              run: sudo chroot-distro unmount test-build-adv || true

            - name: "Remove: test-build-adv"
              run: |
                  sudo chroot-distro remove test-build-adv
                  rm -f /tmp/adv-secret.txt

            # ── Phase 8c: Build Outputs, ADD over HTTP, Failure Paths ──────
            # Covers what 8b does not reach: `--output` archives (packed into
            # the descriptor the staging helper created, so the published file
            # has to be a complete OCI image), the host-loader env vars a
            # Dockerfile may not hand a RUN step, an `--install-as` name that is
            # already taken, an ADD whose response ends short of the length it
            # declared, and what a failed build prints.
            - name: "Build (output): create the build context"
              run: |
                  mkdir -p /tmp/out-build/ctx-tree/sub
                  echo "context-file" > /tmp/out-build/ctx-tree/sub/f.txt
                  cat > /tmp/out-build/Dockerfile << 'DOCKERFILE'
                  FROM alpine:latest
                  ARG LD_AUDIT=./audit-default.so
                  ENV LD_LIBRARY_PATH=lib
                  ENV APP_MODE=prod

                  # A rw bind is a scratch copy the step may do as it likes
                  # with, sealed directories and a tree deeper than the host's
                  # recursion limit included; the teardown after the step still
                  # has to get the copy out.
                  RUN --mount=type=bind,source=ctx-tree,target=/ctx,rw <<'EOF'
                  set -e
                  test -f /ctx/sub/f.txt
                  mkdir -p /ctx/sealed/inner
                  chmod 000 /ctx/sealed
                  cd /ctx
                  i=0
                  # One character per level: the shell tracks its cwd as a string
                  # and 1200 levels of a longer name run past PATH_MAX.
                  while [ "$i" -lt 1200 ]; do
                      mkdir d
                      cd d
                      i=$((i + 1))
                  done
                  EOF

                  # LD_* is read by the host's loader when `chroot` is exec'd, so
                  # neither an ENV line nor a declared ARG's value may reach a RUN
                  # step. Both must be missing from the step's environment.
                  RUN printenv LD_LIBRARY_PATH > /ld-library-path.txt || echo refused > /ld-library-path.txt
                  RUN printenv LD_AUDIT > /ld-audit.txt || echo refused > /ld-audit.txt
                  RUN printenv APP_MODE > /app-mode.txt
                  CMD ["/bin/sh"]
                  DOCKERFILE
                  echo "--- Dockerfile ---"
                  cat /tmp/out-build/Dockerfile

            - name: "Build (output): write the archive checker"
              run: |
                  cat > /tmp/verify-oci.py << 'PY'
                  import hashlib
                  import json
                  import sys
                  import tarfile


                  def blob(tf, digest):
                      hex_digest = digest.split(":", 1)[1]
                      member = f"blobs/sha256/{hex_digest}"
                      data = tf.extractfile(member).read()
                      if hashlib.sha256(data).hexdigest() != hex_digest:
                          sys.exit(f"FAIL: {member} does not hash to its own name")
                      return data


                  with tarfile.open(sys.argv[1]) as tf:
                      names = tf.getnames()
                      if names[0] != "oci-layout":
                          sys.exit(f"FAIL: first member is '{names[0]}', not oci-layout")
                      for required in ("index.json", "manifest.json"):
                          if required not in names:
                              sys.exit(f"FAIL: {required} missing from the archive")
                      index = json.loads(tf.extractfile("index.json").read())
                      docker = json.loads(tf.extractfile("manifest.json").read())
                      manifest = json.loads(blob(tf, index["manifests"][0]["digest"]))
                      config = json.loads(blob(tf, manifest["config"]["digest"]))

                      config_member = "blobs/sha256/" + manifest["config"]["digest"].split(":", 1)[1]
                      if docker[0]["Config"] != config_member:
                          sys.exit("FAIL: the docker-legacy manifest points at another config blob")
                      layer_members = []
                      for layer in manifest["layers"]:
                          data = blob(tf, layer["digest"])
                          if len(data) != layer["size"]:
                              sys.exit(f"FAIL: {layer['digest']} is {len(data)} bytes, the manifest says {layer['size']}")
                          layer_members.append("blobs/sha256/" + layer["digest"].split(":", 1)[1])
                      if docker[0]["Layers"] != layer_members:
                          sys.exit("FAIL: the docker-legacy manifest lists another layer set")
                      if len(config["rootfs"]["diff_ids"]) != len(manifest["layers"]):
                          sys.exit("FAIL: diff_ids and layers disagree on how many layers there are")

                  print(f"layers {len(manifest['layers'])}")
                  print(f"arch {config['architecture']}")
                  for tag in docker[0]["RepoTags"]:
                      print(f"tag {tag}")
                  for entry in config.get("config", {}).get("Env", []):
                      print(f"env {entry}")
                  PY
                  python3 -c "compile(open('/tmp/verify-oci.py').read(), 'verify-oci.py', 'exec')"
                  echo "PASS: checker parses"

            - name: "Build (output): build with two --output archives"
              run: |
                  set -o pipefail
                  sudo chroot-distro build /tmp/out-build \
                    -t test-build-out:latest \
                    --build-arg LD_AUDIT=./audit-passed.so \
                    -o /tmp/out-build.tar \
                    -o /tmp/out-build.tar.gz \
                    --progress plain \
                    --install-as test-build-out 2>&1 | tee /tmp/out-build.log
                  echo "PASS: build with --output completed"

            - name: "Verify (output): both archives are complete OCI images"
              run: |
                  set -o pipefail
                  # Root-owned: the archive is published from a 0600 temporary.
                  sudo python3 /tmp/verify-oci.py /tmp/out-build.tar | tee /tmp/oci-report.txt
                  sudo python3 /tmp/verify-oci.py /tmp/out-build.tar.gz > /tmp/oci-report-gz.txt
                  cat /tmp/oci-report-gz.txt

                  # Every blob hashed to its own name, so the tar carries the whole
                  # image rather than the prefix a lost write would have left.
                  diff /tmp/oci-report.txt /tmp/oci-report-gz.txt
                  echo "PASS: .tar and .tar.gz describe the same image"

                  layers=$(sed -n 's/^layers //p' /tmp/oci-report.txt)
                  [ "$layers" -ge 1 ] || { echo "FAIL: the image has no layers"; exit 1; }
                  grep -qx "tag test-build-out:latest" /tmp/oci-report.txt
                  echo "PASS: archive holds $layers layers and the primary tag"

            - name: "Verify (output): the Dockerfile's LD_* never reached a RUN step"
              run: |
                  run() { sudo chroot-distro login test-build-out -- "$@"; }

                  # The claim is about provenance, not about the variable being
                  # unset: what the Dockerfile said must not be what the step saw.
                  # (The runner's own environment sets LD_LIBRARY_PATH, and a value
                  # the invoking user chose is theirs to pass.)
                  lib=$(run cat /ld-library-path.txt)
                  audit=$(run cat /ld-audit.txt)
                  echo "LD_LIBRARY_PATH seen by the step: $lib"
                  echo "LD_AUDIT seen by the step: $audit"
                  [ "$lib" != "lib" ] \
                    || { echo "FAIL: the ENV line's value reached the RUN step"; exit 1; }
                  [ "$audit" != "./audit-passed.so" ] \
                    || { echo "FAIL: the --build-arg value reached the RUN step"; exit 1; }
                  echo "PASS: neither the ENV line nor the --build-arg value was in the step env"

                  run cat /app-mode.txt | grep -qx "prod"
                  echo "PASS: an ordinary ENV still reaches the step"

                  grep -qF "ignoring 'LD_LIBRARY_PATH' for RUN steps" /tmp/out-build.log
                  grep -qF "ignoring 'LD_AUDIT' for RUN steps" /tmp/out-build.log
                  echo "PASS: the build said what it dropped"

                  # Refused for the exec, kept in the image: what the Dockerfile
                  # says about the image it produces is its author's business.
                  grep -qx "env LD_LIBRARY_PATH=lib" /tmp/oci-report.txt
                  grep -qx "env APP_MODE=prod" /tmp/oci-report.txt
                  echo "PASS: both ENV lines stand in the image config"

            - name: "Verify (output): the scratch root left nothing behind"
              run: |
                  data=$(sudo chroot-distro info 2>&1 | grep -m1 "Data location:" \
                    | sed 's/.*Data location:[[:space:]]*//')
                  echo "Data location: $data"
                  sudo test -d "$data/build-tmp" || { echo "FAIL: no build-tmp; the build fell back to /tmp"; exit 1; }
                  left=$(sudo ls -A "$data/build-tmp" | wc -l)
                  if [ "$left" -ne 0 ]; then
                    sudo ls -lA "$data/build-tmp"
                    echo "FAIL: $left entries survived the build, sealed rw-bind copy included"
                    exit 1
                  fi
                  echo "PASS: build-tmp is empty"

            - name: "Verify (output): --install-as refuses a name already installed"
              run: |
                  set +e
                  sudo chroot-distro build /tmp/out-build -t test-build-out:latest \
                    --install-as test-build-out --progress plain > /tmp/taken.log 2>&1
                  rc=$?
                  set -e
                  cat /tmp/taken.log
                  [ "$rc" -ne 0 ] || { echo "FAIL: a name that is already installed was accepted"; exit 1; }
                  grep -qF "already exists" /tmp/taken.log
                  # The refusal comes before the build, so the container stands.
                  sudo chroot-distro login test-build-out -- cat /app-mode.txt | grep -qx "prod"
                  echo "PASS: the taken name was refused and the container untouched"

            - name: "Verify (output): the archive installs as a container of its own"
              run: |
                  sudo chroot-distro install /tmp/out-build.tar --name test-build-out2
                  output=$(sudo chroot-distro login test-build-out2 -- cat /app-mode.txt)
                  echo "$output"
                  echo "$output" | grep -qx "prod"
                  # The bind was torn down before the layer was snapshotted, so
                  # what the step wrote through it is not in the published image.
                  if sudo chroot-distro login test-build-out2 -- test -e /ctx/sub/f.txt; then
                    echo "FAIL: the rw bind's contents were committed to the image"; exit 1
                  fi
                  echo "PASS: the published archive round-trips through install"

            - name: "Unmount: the --output containers"
              run: |
                  sudo chroot-distro unmount test-build-out || true
                  sudo chroot-distro unmount test-build-out2 || true

            - name: "Remove: the --output containers"
              run: |
                  sudo chroot-distro remove test-build-out
                  sudo chroot-distro remove test-build-out2
                  sudo rm -f /tmp/out-build.tar /tmp/out-build.tar.gz

            - name: "Build (ADD url): start a server that lies about Content-Length"
              run: |
                  cat > /tmp/lying-server.py << 'PY'
                  import http.server
                  import socketserver

                  BODY = b"downloaded-by-add\n"


                  class Handler(http.server.BaseHTTPRequestHandler):
                      protocol_version = "HTTP/1.1"

                      def do_GET(self):
                          if self.path == "/good":
                              self.send_response(200)
                              self.send_header("Content-Length", str(len(BODY)))
                              self.end_headers()
                              self.wfile.write(BODY)
                          elif self.path == "/short":
                              # Claims a megabyte, hangs up after 4 KiB. A
                              # Content-Length body that ends early raises
                              # nothing in http.client, which is why the build
                              # has to compare the counts itself.
                              self.send_response(200)
                              self.send_header("Content-Length", "1048576")
                              self.end_headers()
                              self.wfile.write(b"x" * 4096)
                              self.close_connection = True
                          else:
                              self.send_error(404)

                      def log_message(self, *args):
                          pass


                  class Server(socketserver.ThreadingTCPServer):
                      allow_reuse_address = True
                      daemon_threads = True


                  Server(("127.0.0.1", 8099), Handler).serve_forever()
                  PY
                  nohup python3 /tmp/lying-server.py > /tmp/lying-server.log 2>&1 &
                  for i in $(seq 1 20); do
                    if curl -sf http://127.0.0.1:8099/good | grep -q "downloaded-by-add"; then
                      echo "server answering on attempt $i"
                      break
                    fi
                    sleep 1
                  done
                  curl -sf http://127.0.0.1:8099/good | grep -q "downloaded-by-add"
                  echo "PASS: server up"

            - name: "Build (ADD url): a complete download lands in the image"
              run: |
                  set -o pipefail
                  mkdir -p /tmp/add-build
                  cat > /tmp/add-build/Dockerfile << 'DOCKERFILE'
                  FROM alpine:latest
                  ADD http://127.0.0.1:8099/good /downloaded.txt
                  DOCKERFILE
                  sudo chroot-distro build /tmp/add-build -t test-build-add:latest \
                    --progress plain --install-as test-build-add 2>&1 | tee /tmp/add-build.log
                  output=$(sudo chroot-distro login test-build-add -- cat /downloaded.txt)
                  echo "$output"
                  echo "$output" | grep -qx "downloaded-by-add"
                  echo "PASS: ADD over HTTP wrote the whole body"

            - name: "Build (ADD url): a body that ends early fails the build"
              run: |
                  mkdir -p /tmp/short-build
                  cat > /tmp/short-build/Dockerfile << 'DOCKERFILE'
                  FROM alpine:latest
                  ADD http://127.0.0.1:8099/short /truncated.bin
                  DOCKERFILE
                  set +e
                  sudo chroot-distro build /tmp/short-build -t test-build-short:latest \
                    --progress plain --install-as test-build-short > /tmp/short-build.log 2>&1
                  rc=$?
                  set -e
                  cat /tmp/short-build.log
                  [ "$rc" -ne 0 ] || { echo "FAIL: a truncated download was accepted as the file"; exit 1; }
                  grep -qF "the response ended after 4096 of 1048576 bytes" /tmp/short-build.log
                  if grep -q "Traceback" /tmp/short-build.log; then
                    echo "FAIL: the failure left the program as a traceback"; exit 1
                  fi
                  if sudo chroot-distro list -q 2>&1 | grep -q "test-build-short"; then
                    echo "FAIL: the failed build still installed a container"; exit 1
                  fi
                  echo "PASS: the short body failed the build, cleanly and with nothing installed"

            - name: "Build (ADD url): stop the server"
              if: always()
              run: pkill -f lying-server.py || true

            - name: "Remove: test-build-add"
              run: |
                  sudo chroot-distro unmount test-build-add || true
                  sudo chroot-distro remove test-build-add

            - name: "Build (failure): an untrusted name in an error is escaped"
              run: |
                  # The name a failed build reports on is not always the author's
                  # -- a member of an ADD'd archive, an entry of a base image --
                  # and one holding ESC repaints the terminal it is printed to.
                  mkdir -p /tmp/escape-build
                  printf 'FROM alpine:latest\nCOPY nope\033file.txt /nope.txt\n' \
                    > /tmp/escape-build/Dockerfile
                  cat -v /tmp/escape-build/Dockerfile
                  set +e
                  sudo chroot-distro build /tmp/escape-build -t test-build-escape:latest \
                    --progress plain > /tmp/escape-build.log 2>&1
                  rc=$?
                  set -e
                  cat -v /tmp/escape-build.log
                  [ "$rc" -ne 0 ] || { echo "FAIL: a missing COPY source did not fail the build"; exit 1; }
                  # The progress log echoes the Dockerfile's own lines, which is
                  # the author's text; the assertion is about the error line, whose
                  # name may just as well have come out of an image.
                  grep -F "Build failed" /tmp/escape-build.log > /tmp/escape-failline.txt \
                    || { echo "FAIL: the build printed no failure line"; exit 1; }
                  cat -v /tmp/escape-failline.txt
                  grep -qF 'nope\efile.txt' /tmp/escape-failline.txt \
                    || { echo "FAIL: the reported name was not escaped"; exit 1; }
                  if grep -qF "$(printf 'nope\033file.txt')" /tmp/escape-failline.txt; then
                    echo "FAIL: a raw escape reached the terminal"; exit 1
                  fi
                  [ "$(wc -l < /tmp/escape-failline.txt)" -eq 1 ] \
                    || { echo "FAIL: the failure was not one line"; exit 1; }
                  if grep -q "Traceback" /tmp/escape-build.log; then
                    echo "FAIL: the failure left the program as a traceback"; exit 1
                  fi
                  echo "PASS: the name was printed escaped and the build failed cleanly"

            # ── Phase 10: Namespace Security Tests ──────────────────────────
            # Regression tests for the security report findings (Tests 2,3,7).
            # These verify that --isolated mode provides the expected isolation
            # properties when kernel support is available.

            - name: "Security: Install Debian for security tests"
              run: |
                  sudo chroot-distro install debian:bookworm-slim --name debian-sec || true
                  # Ensure it's in a clean state
                  sudo chroot-distro unmount debian-sec 2>/dev/null || true

            - name: "Security: Verify mount namespace isolation"
              run: |
                  # Host and container mount namespaces should differ
                  host_mnt=$(readlink /proc/self/ns/mnt)
                  container_mnt=$(sudo chroot-distro login debian-sec --isolated -- \
                    readlink /proc/self/ns/mnt)
                  echo "Host mnt ns: $host_mnt"
                  echo "Container mnt ns: $container_mnt"
                  if [ "$host_mnt" = "$container_mnt" ]; then
                    echo "FAIL: Mount namespace not isolated!"
                    exit 1
                  fi
                  echo "PASS: Mount namespace isolated"

            - name: "Unmount: debian-sec after mount ns test"
              run: sudo chroot-distro unmount debian-sec || true

            - name: "Security: Verify PID namespace isolation"
              run: |
                  # A host-only PID should not be visible inside container
                  sleep 9999 &
                  host_pid=$!
                  output=$(sudo chroot-distro login debian-sec --isolated -- \
                    sh -c "ls /proc/$host_pid/ 2>&1 || echo PID_HIDDEN")
                  echo "$output"
                  kill $host_pid 2>/dev/null || true
                  if echo "$output" | grep -q "PID_HIDDEN\|No such file"; then
                    echo "PASS: Host PID not visible in container (PID namespace isolated)"
                  else
                    echo "FAIL: Host PID visible in container!"
                    exit 1
                  fi

            - name: "Unmount: debian-sec after PID ns test"
              run: sudo chroot-distro unmount debian-sec || true


            - name: "Security: Verify user namespace uid mapping (finding #2)"
              run: |
                  # Report finding #2: container root must live in a real, bounded
                  # user namespace (uid_map like "0 0 65536"), NOT the host's
                  # initial user namespace (identity map "0 0 4294967295").
                  host_userns=$(readlink /proc/self/ns/user)
                  out=$(sudo chroot-distro login debian-sec --isolated -- sh -c \
                    'printf "NS=%s\n" "$(readlink /proc/self/ns/user)"; \
                     printf "MAP=%s\n" "$(tr -s " " < /proc/self/uid_map | sed "s/^ *//")"')
                  echo "$out"
                  cont_userns=$(echo "$out" | sed -n 's/^NS=//p')
                  uid_map=$(echo "$out" | sed -n 's/^MAP=//p')
                  count=$(echo "$uid_map" | awk '{print $3}')
                  echo "Host  user ns: $host_userns"
                  echo "Cont  user ns: $cont_userns"
                  echo "Cont  uid_map: '$uid_map'"
                  if [ -z "$count" ] || [ "$count" = "4294967295" ]; then
                    # No user namespace on this kernel — graceful degradation
                    # (capability-drop tier) is by design, so this is not a failure.
                    echo "NOTE: user namespace unavailable here (Tier C fallback); uid-map check skipped."
                  else
                    if [ "$host_userns" = "$cont_userns" ]; then
                      echo "FAIL: container shares the host user namespace (no uid isolation)"; exit 1
                    fi
                    echo "PASS: real user namespace active with a bounded uid_map ($uid_map)"
                  fi

            - name: "Unmount: debian-sec after uid-map test"
              run: sudo chroot-distro unmount debian-sec || true

            - name: "Security: Verify capability confinement under sudo (finding #3)"
              run: |
                  # Report finding #3: container root must NOT wield host-level
                  # capabilities. Determine the active tier from uid_map, then
                  # assert the appropriate confinement.
                  uid_map=$(sudo chroot-distro login debian-sec --isolated -- \
                    sh -c 'tr -s " " < /proc/self/uid_map | sed "s/^ *//"')
                  count=$(echo "$uid_map" | awk '{print $3}')
                  echo "uid_map: '$uid_map'"
                  if [ -n "$count" ] && [ "$count" != "4294967295" ]; then
                    # User namespace active: capabilities are namespace-scoped.
                    # A privileged op that needs real (init-userns) CAP_SYS_ADMIN
                    # — mounting a fresh sysfs — must be denied even though the
                    # in-namespace CapEff looks full.
                    res=$(sudo chroot-distro login debian-sec --isolated -- sh -c \
                      'mkdir -p /tmp/capchk; if mount -t sysfs sysfs /tmp/capchk 2>/dev/null; then \
                         umount /tmp/capchk 2>/dev/null; echo RESULT=ALLOWED; else echo RESULT=DENIED; fi')
                    echo "$res"
                    if echo "$res" | grep -q "RESULT=ALLOWED"; then
                      echo "FAIL: init-privileged mount succeeded — capabilities NOT confined"; exit 1
                    fi
                    echo "PASS: host-level capability denied — capabilities are namespace-scoped"
                  else
                    # No user namespace: the cap-drop fallback must have removed
                    # the dangerous caps from the bounding set (not the full set).
                    out=$(sudo chroot-distro login debian-sec --isolated -- \
                      sh -c 'grep CapBnd /proc/self/status')
                    echo "$out"
                    cap_bnd=$(echo "$out" | awk '{print $2}')
                    if [ "$cap_bnd" = "000001ffffffffff" ]; then
                      echo "FAIL: full capability bounding set — neither user namespace nor cap-drop active"; exit 1
                    fi
                    echo "PASS: capability bounding set restricted (cap-drop fallback)"
                  fi

            - name: "Unmount: debian-sec after cap test"
              run: sudo chroot-distro unmount debian-sec || true

            - name: "Security: Verify ownership of sudo-created files (finding #7)"
              run: |
                  # Report finding #7: a file created by container-root should not
                  # grant host root. Create one, then inspect it from the host.
                  data=$(sudo chroot-distro info 2>&1 | grep -m1 "Data location:" \
                    | sed 's/.*Data location:[[:space:]]*//')
                  rootfs="$data/containers/debian-sec/rootfs"
                  echo "Container rootfs: $rootfs"
                  sudo chroot-distro login debian-sec --isolated -- sh -c 'touch /root/uidtest_ci'
                  owner=$(sudo stat -c '%u' "$rootfs/root/uidtest_ci")
                  echo "Host-side owner uid of the container-root-created file: $owner"
                  uid_map=$(sudo chroot-distro login debian-sec --isolated -- \
                    sh -c 'tr -s " " < /proc/self/uid_map | sed "s/^ *//"')
                  base=$(echo "$uid_map" | awk '{print $2}')
                  count=$(echo "$uid_map" | awk '{print $3}')
                  echo "uid_map: '$uid_map'"
                  if [ -n "$count" ] && [ "$count" != "4294967295" ] && [ "$base" != "0" ]; then
                    # Tier B (subordinate remap active): the file must be owned by
                    # an unprivileged host uid, never real root.
                    if [ "$owner" = "0" ]; then
                      echo "FAIL: uid remap active but file still owned by host root (uid 0)"; exit 1
                    fi
                    echo "PASS: sudo-created file owned by unprivileged host uid $owner (finding #7 fixed)"
                  else
                    # Tier A (identity userns) or Tier C: uid remap not active, so
                    # the file is owned by host root. This is the documented state
                    # until the Tier B idmapped-rootfs integration is enabled
                    # (namespace._TIER_B_ROOTFS_IDMAP_READY). Capability scoping
                    # (finding #3) is the active mitigation in this mode.
                    echo "NOTE: uid remap not active (Tier A/C); file owned by uid $owner (expected)."
                    echo "      Finding #7 is fully closed only under Tier B (idmapped rootfs)."
                  fi

            - name: "Unmount: debian-sec after file-ownership test"
              run: sudo chroot-distro unmount debian-sec || true

            - name: "Security: Verify cross-signal blocking"
              run: |
                  # Start a host process, try to signal it from inside container
                  sleep 9999 &
                  bystander_pid=$!
                  echo "Host bystander PID: $bystander_pid"
                  output=$(sudo chroot-distro login debian-sec --isolated -- \
                    sh -c "kill -0 $bystander_pid 2>&1 || echo SIGNAL_BLOCKED")
                  echo "$output"
                  kill $bystander_pid 2>/dev/null || true
                  if echo "$output" | grep -q "SIGNAL_BLOCKED\|No such process"; then
                    echo "PASS: Cross-boundary signal blocked"
                  else
                    echo "FAIL: Container could signal host process!"
                    exit 1
                  fi

            - name: "Unmount: debian-sec after signal test"
              run: sudo chroot-distro unmount debian-sec || true

            - name: "Security: Verify path traversal blocked"
              run: |
                  output=$(sudo chroot-distro login debian-sec --isolated -- \
                    sh -c 'cat /proc/self/root/../../../../etc/hostname 2>&1')
                  echo "$output"
                  host_hostname=$(hostname)
                  if echo "$output" | grep -q "$host_hostname"; then
                    echo "FAIL: Path traversal reached host filesystem!"
                    exit 1
                  fi
                  echo "PASS: Path traversal contained within container"

            - name: "Unmount: debian-sec after traversal test"
              run: sudo chroot-distro unmount debian-sec || true

            - name: "Security: Verify graceful degradation warnings"
              run: |
                  # The --isolated login should produce isolation status output
                  # showing which namespaces are active
                  output=$(sudo chroot-distro login debian-sec --isolated -- \
                    echo "isolation-check" 2>&1)
                  echo "$output"
                  # On GitHub runners (full kernel support), we should see
                  # successful isolation. The key test is that it doesn't
                  # crash or refuse to start.
                  echo "$output" | grep -q "isolation-check"
                  echo "PASS: Isolated login completed successfully"

            - name: "Unmount: debian-sec after degradation test"
              run: sudo chroot-distro unmount debian-sec || true

            - name: "Remove: debian-sec"
              run: sudo chroot-distro remove debian-sec || true

            # ── Phase 9: Final Cleanup ─────────────────────────────────────
            - name: "Cleanup: remove all containers"
              if: always()
              run: |
                  echo "=== Killing all sessions ==="
                  sudo chroot-distro kill httpd 2>/dev/null || true
                  pkill -f lying-server.py 2>/dev/null || true
                  echo "=== Unmounting all containers ==="
                  for name in httpd debian alpine alpine-test test-build test-build-adv \
                              test-build-out test-build-out2 test-build-add debian-sec; do
                    sudo chroot-distro unmount "$name" 2>/dev/null || true
                  done
                  echo "=== Removing all containers ==="
                  for name in httpd debian alpine alpine-test test-build test-build-adv \
                              test-build-out test-build-out2 test-build-add debian-sec; do
                    sudo chroot-distro remove "$name" 2>/dev/null || true
                  done
                  echo "=== Final state ==="
                  sudo chroot-distro list
                  echo "=== Cleanup complete ==="

            - name: "Final: verify clean state"
              if: always()
              run: |
                  output=$(sudo chroot-distro list -q 2>&1)
                  echo "Remaining containers: '$output'"
